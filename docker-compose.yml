# Phase B — PostgreSQL 16 pour le CDM OMOP (Synthea). Identifiants lus dans .env.
# Démarrage : docker compose up -d ; arrêt : docker compose down (le volume est conservé).
services:
  postgres:
    image: postgres:16
    container_name: omop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      CDM_SCHEMA: ${CDM_SCHEMA:-cdm}
      SYNTHEA_SCHEMA: ${SYNTHEA_SCHEMA:-native}
      RESULTS_SCHEMA: ${RESULTS_SCHEMA:-results}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # exposé en local uniquement
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
