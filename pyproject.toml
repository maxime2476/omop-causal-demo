[project]
name = "omop-causal"
version = "0.1.0"
description = "Démonstration : ETL OMOP-CDM, qualité des données et inférence causale sur données synthétiques."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maxime Gourguechon" }]
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "lifelines>=0.29",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
omop-causal = "omop_causal.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omop_causal"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "D401", "D413", "N803", "N806"]  # docstrings FR ; X = matrice

[tool.ruff.lint.isort]
known-first-party = ["omop_causal", "pmsi_demo"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "pmsi_demo"]

[[tool.mypy.overrides]]
module = ["lifelines.*", "sklearn.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
